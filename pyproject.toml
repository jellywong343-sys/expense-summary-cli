[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "expense-summary-cli"
version = "1.0.0"
description = "Summarize expense CSV files by month and category with filters and CSV or JSON reports."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "jellywong343-sys" }]
dependencies = []
keywords = ["python","expenses","csv","reporting","cli"]

[project.scripts]
expense-summary = "expense_summary_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
